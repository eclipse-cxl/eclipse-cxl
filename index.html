<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Shop</title>

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* BACKGROUND */
body {
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: white;
    overflow-x: hidden;
}

/* LOADER */
#loader {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    font-size: 28px;
    letter-spacing: 6px;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #00f7ff; }
    to { text-shadow: 0 0 30px #00f7ff, 0 0 60px #00f7ff; }
}

/* HEADER */
h1 {
    text-align: center;
    margin: 40px 0 20px;
    letter-spacing: 6px;
}

/* CONTAINER */
.container {
    padding: 10px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    margin: 15px;
    padding: 20px;
    border-radius: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.4s;
    border: 1px solid rgba(255,255,255,0.1);
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 25px #00f7ff55;
}

/* TEXT */
.price {
    font-size: 22px;
    font-weight: 600;
}

/* BUTTON */
button {
    background: transparent;
    border: 1px solid #00f7ff;
    color: #00f7ff;
    padding: 10px 20px;
    border-radius: 30px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

button::after {
    content: "";
    position: absolute;
    width: 0;
    height: 100%;
    background: #00f7ff;
    left: 0;
    top: 0;
    transition: 0.3s;
    z-index: -1;
}

button:hover::after {
    width: 100%;
}

button:hover {
    color: black;
}

/* MODAL */
#modal {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal-box {
    background: #111;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    border: 1px solid #00f7ff;
    animation: pop 0.3s ease;
}

@keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* FLOAT BUTTON */
.dm-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #00f7ff;
    color: black;
    padding: 15px;
    border-radius: 50%;
    font-weight: bold;
    box-shadow: 0 0 20px #00f7ff;
    cursor: pointer;
}

/* FOOTER */
.footer {
    text-align: center;
    margin: 30px;
    color: #aaa;
}
</style>
</head>

<body>

<div id="loader">ECLIPSE</div>

<h1>ECLIPSE SHOP</h1>

<div class="container">

<div class="card">
    <div>
        <div>$5 CODE</div>
        <div class="price">KSH 1599</div>
    </div>
    <button onclick="buy('5')">Buy</button>
</div>

<div class="card">
    <div>
        <div>$10 CODE</div>
        <div class="price">KSH 2999</div>
    </div>
    <button onclick="buy('10')">Buy</button>
</div>

<div class="card">
    <div>
        <div>$25 CODE</div>
        <div class="price">KSH 6999</div>
    </div>
    <button onclick="buy('25')">Buy</button>
</div>

</div>

<div class="footer">
DM us on Instagram to complete your order
</div>

<!-- FLOAT BUTTON -->
<div class="dm-btn" onclick="goDM()">DM</div>

<!-- MODAL -->
<div id="modal">
    <div class="modal-box">
        <h2>Processing Order...</h2>
        <p>Connecting to checkout</p>
    </div>
</div>

<script>

// LOADER
window.onload = () => {
    setTimeout(() => {
        document.getElementById("loader").style.display = "none";
    }, 1500);
}

// BUY FUNCTION
function buy(amount) {
    document.getElementById("modal").style.display = "flex";

    setTimeout(() => {
        window.location.href = "https://instagram.com/_.bradle.y";
    }, 2000);
}

// FLOAT BUTTON
function goDM() {
    window.location.href = "https://instagram.com/_.bradle.y";
}

</script>

</body>
</html>
