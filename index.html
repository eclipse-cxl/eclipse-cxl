<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECLIPSE SHOP</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #111;
}

/* LOADING SCREEN */
#loader {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 24px;
  z-index: 9999;
  animation: fadeOut 1s ease 2.5s forwards;
}

@keyframes fadeOut {
  to { opacity: 0; visibility: hidden; }
}

/* HEADER */
header {
  padding: 20px;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 2px;
}

/* PRODUCTS */
.container {
  padding: 20px;
}

.product {
  background: #f5f5f5;
  margin: 15px 0;
  padding: 20px;
  border-radius: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.price {
  font-weight: bold;
  font-size: 18px;
}

/* BUTTONS */
.btn {
  padding: 10px 20px;
  background: black;
  color: white;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: #333;
  transform: scale(1.05);
}

/* CHECKOUT MODAL */
#checkout {
  position: fixed;
  bottom: -100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  transition: 0.4s;
  padding: 20px;
}

#checkout.active {
  bottom: 0;
}

.checkout-box {
  max-width: 400px;
  margin: auto;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  font-size: 14px;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">ECLIPSE LOADING...</div>

<header>ECLIPSE SHOP</header>

<div class="container">

  <!-- PRODUCTS -->
  <div class="product">
    <div>
      <div>$5 CODE</div>
      <div class="price">KSH 1599</div>
    </div>
    <button class="btn" onclick="openCheckout('$5 Code')">Buy</button>
  </div>

  <div class="product">
    <div>
      <div>$10 CODE</div>
      <div class="price">KSH 2999</div>
    </div>
    <button class="btn" onclick="openCheckout('$10 Code')">Buy</button>
  </div>

  <div class="product">
    <div>
      <div>$25 CODE</div>
      <div class="price">KSH 6999</div>
    </div>
    <button class="btn" onclick="openCheckout('$25 Code')">Buy</button>
  </div>

</div>

<!-- CHECKOUT -->
<div id="checkout">
  <div class="checkout-box">
    <h2 id="itemName">Checkout</h2>

    <input type="text" placeholder="Your Name">
    <input type="text" placeholder="Phone Number">

    <button class="btn" onclick="fakePay()">Pay Now</button>
    <br><br>
    <button class="btn" onclick="closeCheckout()">Cancel</button>
  </div>
</div>

<footer>
  DM us on Instagram to complete your order
</footer>

<script>
function openCheckout(item) {
  document.getElementById("checkout").classList.add("active");
  document.getElementById("itemName").innerText = item;
}

function closeCheckout() {
  document.getElementById("checkout").classList.remove("active");
}

function fakePay() {
  alert("Securing payment...");
  
  setTimeout(() => {
    alert("Redirecting to Instagram...");
    window.location.href = "https://instagram.com/_.bradle.y";
  }, 2000);
}
</script>

</body>
</html>
