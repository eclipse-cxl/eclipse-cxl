<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Store KE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#07080c;
color:white;
}

/* HERO */
.hero{
position:relative;
height:340px;
overflow:hidden;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
opacity:0.65;
}

.hero-content{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
display:flex;
flex-direction:column;
justify-content:center;
padding:20px;
}

.logo{
font-size:22px;
font-weight:bold;
color:#00ffe1;
}

.hero h1{
font-size:30px;
margin-top:10px;
}

.hero p{
opacity:0.8;
margin-top:5px;
}

/* FILTERS */
.filters{
display:flex;
gap:10px;
padding:15px;
}

select{
flex:1;
padding:12px;
border-radius:10px;
background:#111;
color:white;
border:none;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
padding:15px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:14px;
backdrop-filter:blur(10px);
position:relative;
}

.badge{
position:absolute;
top:10px;
right:10px;
background:#00ffe1;
color:black;
padding:3px 8px;
font-size:10px;
border-radius:8px;
}

.card h3{font-size:14px;}
.price{margin:8px 0;font-weight:bold;}

/* BUTTONS */
.btn-group{
display:flex;
gap:8px;
}

.btn{
flex:1;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:12px;
}

.wa{background:#25D366;color:white;}
.ig{background:#E1306C;color:white;}

/* FOOTER */
footer{
text-align:center;
padding:20px;
opacity:0.6;
font-size:12px;
}
</style>
</head>

<body>

<div class="hero">
<img src="https://images.unsplash.com/photo-1605902711622-cfb43c44367f">
<div class="hero-content">
<div class="logo">Eclipse Store KE</div>
<h1>Digital Gift Cards</h1>
<p>Fast • Trusted • Instant Delivery</p>
</div>
</div>

<div class="filters">
<select id="category" onchange="render()">
<option value="">All Categories</option>
<option value="PSN">PSN</option>
<option value="Xbox">Xbox</option>
<option value="Roblox">Roblox</option>
<option value="Amazon">Amazon</option>
<option value="Steam">Steam</option>
<option value="Apple">Apple</option>
<option value="Google">Google Play</option>
</select>

<select id="region" onchange="render()">
<option value="">All Regions</option>
<option>USA</option>
<option>UK</option>
<option>UAE</option>
<option>EU</option>
<option>Canada</option>
<option>South Africa</option>
</select>
</div>

<div class="grid" id="grid"></div>

<footer>© Eclipse Store KE</footer>

<script>

/* PRODUCTS */
const products = [

/* PSN USA */
{name:"PSN $5 (USA)",price:"KSh 800",category:"PSN",region:"USA"},
{name:"PSN $10 (USA)",price:"KSh 1500",category:"PSN",region:"USA"},
{name:"PSN $25 (USA)",price:"KSh 3700",category:"PSN",region:"USA",badge:"BEST SELLER"},
{name:"PSN $50 (USA)",price:"KSh 7200",category:"PSN",region:"USA",badge:"BEST SELLER"},
{name:"PSN $100 (USA)",price:"KSh 14200",category:"PSN",region:"USA"},

/* PSN SOUTH AFRICA */
{name:"PSN R100 (SA)",price:"KSh 900",category:"PSN",region:"South Africa"},
{name:"PSN R250 (SA)",price:"KSh 2100",category:"PSN",region:"South Africa"},
{name:"PSN R500 (SA)",price:"KSh 4200",category:"PSN",region:"South Africa"},

/* XBOX */
{name:"Xbox $10",price:"KSh 1500",category:"Xbox",region:"USA"},
{name:"Xbox $25",price:"KSh 3700",category:"Xbox",region:"USA",badge:"BEST SELLER"},
{name:"Xbox $50",price:"KSh 7200",category:"Xbox",region:"USA",badge:"BEST SELLER"},

/* ROBLOX */
{name:"Roblox $10",price:"KSh 1500",category:"Roblox",region:"Global"},
{name:"Roblox $25",price:"KSh 3700",category:"Roblox",region:"Global"},

/* OTHERS */
{name:"Amazon $25",price:"KSh 3700",category:"Amazon",region:"USA"},
{name:"Steam $20",price:"KSh 3000",category:"Steam",region:"Global"},
{name:"Apple $25",price:"KSh 3700",category:"Apple",region:"USA"},
{name:"Google Play $10",price:"KSh 1500",category:"Google",region:"USA"}

];

function render(){
const grid=document.getElementById("grid");
grid.innerHTML="";

const cat=document.getElementById("category").value;
const reg=document.getElementById("region").value;

products.filter(p=>(!cat||p.category===cat)&&(!reg||p.region===reg))
.forEach(p=>{
grid.innerHTML+=`
<div class="card">
${p.badge?`<div class="badge">${p.badge}</div>`:""}
<h3>${p.name}</h3>
<div class="price">${p.price}</div>

<div class="btn-group">
<button class="btn wa" onclick="wa('${p.name}','${p.price}')">WhatsApp</button>
<a href="https://ig.me/m/eclipse.store.ke" target="_blank" class="btn ig" onclick="ig('${p.name}','${p.price}')">Instagram</a>
</div>

</div>
`;
});
}

function wa(name,price){
const msg=`Order: ${name} - ${price}`;
window.open(`https://wa.me/0791994148?text=${encodeURIComponent(msg)}`);
}

function ig(name,price){
const msg=`Order: ${name} - ${price}`;
navigator.clipboard.writeText(msg);
alert("Message copied. Paste it in Instagram DM.");
}

render();

</script>

</body>
</html>
