<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Store KE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
background:linear-gradient(180deg,#020202,#050505);
color:white;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:100;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
background:linear-gradient(270deg,#00e5ff,#00ffcc,#00e5ff);
background-size:400% 400%;
animation:glow 6s ease infinite;
color:black;
}

@keyframes glow{
0%{background-position:0%}
50%{background-position:100%}
100%{background-position:0%}
}

/* FILTERS */
.filters{
display:flex;
gap:10px;
padding:12px;
position:sticky;
top:70px;
z-index:99;
background:rgba(5,5,5,0.9);
backdrop-filter:blur(12px);
}

.filter-box{flex:1;}

.filter-box select{
width:100%;
padding:14px;
border-radius:14px;
background:rgba(255,255,255,0.05);
color:white;
border:1px solid rgba(255,255,255,0.1);
}

/* GRID */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
padding:15px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
border-radius:18px;
padding:18px;
text-align:center;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.05);
position:relative;
}

/* BEST SELLER */
.badge{
position:absolute;
top:10px;
left:10px;
background:#00ffcc;
color:black;
font-size:10px;
padding:5px 8px;
border-radius:8px;
font-weight:bold;
}

/* BUTTON GROUP */
.btn-group{
display:flex;
gap:10px;
margin-top:12px;
}

.btn{
flex:1;
padding:10px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.wa{background:#25D366;color:white;}
.ig{background:linear-gradient(45deg,#fd5949,#d6249f,#285AEB);color:white;}

footer{
text-align:center;
padding:20px;
opacity:0.6;
}

/* TITLES */
h3{margin-bottom:5px;}
p{opacity:0.7;}
</style>
</head>

<body>

<header>ECLIPSE STORE KE</header>

<!-- FILTERS -->
<div class="filters">
<div class="filter-box">
<select id="categoryFilter" onchange="filterProducts()">
<option value="all">All Categories</option>
<option value="PSN">PSN</option>
<option value="Amazon">Amazon</option>
<option value="Roblox">Roblox</option>
<option value="Steam">Steam</option>
<option value="Apple">Apple</option>
<option value="Google">Google Play</option>
</select>
</div>

<div class="filter-box">
<select id="regionFilter" onchange="filterProducts()">
<option value="all">All Regions</option>
<option value="USA">USA</option>
<option value="UK">UK</option>
<option value="UAE">UAE</option>
<option value="EU">EU</option>
</select>
</div>
</div>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<footer>© Eclipse Store KE</footer>

<script>
const products = [

/* 🔥 PSN FULL SET */
{name:"PSN $5",price:"800 KES",category:"PSN",region:"USA"},
{name:"PSN $10",price:"1500 KES",category:"PSN",region:"USA"},
{name:"PSN $25",price:"3500 KES",category:"PSN",region:"USA",badge:true},
{name:"PSN $50",price:"6800 KES",category:"PSN",region:"USA",badge:true},
{name:"PSN $100",price:"13500 KES",category:"PSN",region:"USA"},

{name:"PSN £10",price:"1900 KES",category:"PSN",region:"UK"},
{name:"PSN £25",price:"4200 KES",category:"PSN",region:"UK"},
{name:"PSN £50",price:"7800 KES",category:"PSN",region:"UK"},

{name:"PSN AED 50",price:"2100 KES",category:"PSN",region:"UAE"},
{name:"PSN AED 100",price:"4000 KES",category:"PSN",region:"UAE"},

/* OTHER CARDS */
{name:"Amazon $10",price:"1600 KES",category:"Amazon",region:"USA"},
{name:"Amazon $25",price:"3600 KES",category:"Amazon",region:"USA"},
{name:"Amazon $50",price:"7000 KES",category:"Amazon",region:"USA"},

{name:"Roblox $10",price:"1500 KES",category:"Roblox",region:"USA"},
{name:"Roblox $25",price:"3400 KES",category:"Roblox",region:"USA"},

{name:"Steam $20",price:"3000 KES",category:"Steam",region:"USA"},
{name:"Steam $50",price:"7000 KES",category:"Steam",region:"USA"},

{name:"Apple $10",price:"1500 KES",category:"Apple",region:"USA"},
{name:"Apple $25",price:"3600 KES",category:"Apple",region:"USA"},

{name:"Google Play $10",price:"1500 KES",category:"Google",region:"USA"},
{name:"Google Play $25",price:"3500 KES",category:"Google",region:"USA"}

];

function displayProducts(list){
const container=document.getElementById("products");
container.innerHTML="";

list.forEach(p=>{
container.innerHTML+=`
<div class="card">
${p.badge ? '<div class="badge">BEST SELLER</div>' : ''}
<h3>${p.name}</h3>
<p>${p.price}</p>

<div class="btn-group">
<button class="btn wa" onclick="buyNow('${p.name}','${p.price}')">WhatsApp</button>
<a href="https://instagram.com/eclipse.store.ke" target="_blank">
<button class="btn ig">Instagram</button>
</a>
</div>

</div>
`;
});
}

function filterProducts(){
const cat=document.getElementById("categoryFilter").value;
const reg=document.getElementById("regionFilter").value;

const filtered=products.filter(p=>{
return (cat==="all"||p.category===cat) &&
(reg==="all"||p.region===reg);
});

displayProducts(filtered);
}

function buyNow(name,price){
const msg=`Hello, I want ${name} for ${price}`;
window.open(`https://wa.me/0791994148?text=${encodeURIComponent(msg)}`);
}

displayProducts(products);
</script>

</body>
</html>
