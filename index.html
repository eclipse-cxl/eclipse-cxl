<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Store KE</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050505;
color:white;
}

/* HEADER */
header{
text-align:center;
padding:20px;
font-size:24px;
color:#00e5ff;
text-shadow:0 0 15px #00e5ff;
}

/* SELECTORS */
.selectors{
display:flex;
gap:10px;
padding:15px;
}

select{
flex:1;
padding:12px;
border-radius:12px;
border:none;
background:#111;
color:white;
box-shadow:0 0 12px #00e5ff33;
}

/* GRID */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
padding:15px;
}

/* CARD */
.card{
background:#0f0f0f;
padding:15px;
border-radius:16px;
text-align:center;
transition:0.3s;
border:1px solid #1a1a1a;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 0 25px #00e5ff88;
}

.tag{
font-size:12px;
color:#00e5ff;
margin-bottom:5px;
}

.price{
font-size:18px;
color:#00ffcc;
margin:10px 0;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
margin-top:5px;
color:white;
cursor:pointer;
}

/* BUTTONS */
.wa{background:#00c853;box-shadow:0 0 10px #00c853;}
.ig{background:#E1306C;box-shadow:0 0 10px #E1306C;}

</style>
</head>

<body>

<header>ECLIPSE STORE KE</header>

<div class="selectors">
<select id="category" onchange="renderProducts()">
<option value="psn">PSN</option>
<option value="xbox">Xbox</option>
<option value="steam">Steam</option>
<option value="itunes">iTunes</option>
<option value="google">Google Play</option>
<option value="amazon">Amazon</option>
<option value="netflix">Netflix</option>
<option value="spotify">Spotify</option>
<option value="binance">Binance</option>
<option value="razer">Razer Gold</option>
</select>

<select id="region" onchange="renderProducts()">
<option value="USA">🇺🇸 USA</option>
<option value="UK">🇬🇧 UK</option>
<option value="EU">🇪🇺 EUROPE</option>
<option value="UAE">🇦🇪 UAE</option>
<option value="JP">🇯🇵 JAPAN</option>
<option value="ZA">🇿🇦 SOUTH AFRICA</option>
<option value="GLOBAL">🌍 GLOBAL</option>
</select>
</div>

<div id="products" class="products"></div>

<script>

const flags={
USA:"🇺🇸",UK:"🇬🇧",EU:"🇪🇺",UAE:"🇦🇪",JP:"🇯🇵",ZA:"🇿🇦",GLOBAL:"🌍"
};

const products=[];

// ===== PSN =====
[
["$5",799],["$10",1599],["$25",3999],["$50",7999],["$75",11999],["$100",15999]
].forEach(p=>{
products.push({cat:"psn",region:"USA",name:"PSN "+p[0],price:p[1]});
});

[
["£10",1899],["£20",3599],["£50",8999]
].forEach(p=>{
products.push({cat:"psn",region:"UK",name:"PSN "+p[0],price:p[1]});
});

[
["€10",1999],["€20",3799],["€50",8999]
].forEach(p=>{
products.push({cat:"psn",region:"EU",name:"PSN "+p[0],price:p[1]});
});

products.push({cat:"psn",region:"ZA",name:"PSN R200",price:1899});
products.push({cat:"psn",region:"JP",name:"PSN ¥3000",price:3999});

// ===== XBOX =====
[5,10,15,20,25,50,100].forEach(v=>{
products.push({cat:"xbox",region:"USA",name:`Xbox $${v}`,price:v*155});
});

// ===== GENERIC SERIES FUNCTION =====
function addSeries(cat,name,vals,rate,region="USA"){
vals.forEach(v=>{
products.push({
cat,region,name:`${name} $${v}`,price:Math.round(v*rate)
});
});
}

// OTHER CARDS
addSeries("steam","Steam",[10,20,50],155);
addSeries("itunes","iTunes",[10,25,50],155);
addSeries("google","Google Play",[10,25,50],150);
addSeries("amazon","Amazon",[10,25,50],160);

// GLOBAL CARDS
addSeries("netflix","Netflix",[10,25,50],150,"GLOBAL");
addSeries("spotify","Spotify",[10,30,60],140,"GLOBAL");
addSeries("binance","USDT",[10,50,100],150,"GLOBAL");
addSeries("razer","Razer Gold",[10,25,50],155,"GLOBAL");

// RENDER
function renderProducts(){
let cat=document.getElementById("category").value;
let region=document.getElementById("region").value;

let container=document.getElementById("products");
container.innerHTML="";

products.forEach(p=>{
if(p.cat===cat && p.region===region){

container.innerHTML+=`
<div class="card">
<div class="tag">${p.tag||""}</div>
<h3>${p.name}</h3>
<div>${flags[p.region]} ${p.region}</div>
<div class="price">KSh ${p.price}</div>

<button class="wa" onclick="buy('${p.name} ${p.region}')">WhatsApp</button>
<button class="ig" onclick="ig()">Instagram</button>
</div>
`;
}
});
}

// CHECKOUT
function buy(product){
window.open("https://wa.me/254791994148?text="+encodeURIComponent("Hi, I want "+product));
}

function ig(){
window.open("https://instagram.com/eclipse.store.ke");
}

renderProducts();

</script>

</body>
</html>
