<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Store KE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
background:linear-gradient(180deg,#020202,#050505);
color:white;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:100;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
background:linear-gradient(270deg,#00e5ff,#00ffcc,#00e5ff);
background-size:400% 400%;
animation:glow 6s ease infinite;
color:black;
}

@keyframes glow{
0%{background-position:0%}
50%{background-position:100%}
100%{background-position:0%}
}

/* FILTERS */
.filters{
display:flex;
gap:10px;
padding:12px;
position:sticky;
top:70px;
background:#050505;
z-index:99;
}

select{
flex:1;
padding:14px;
border-radius:12px;
background:rgba(255,255,255,0.05);
color:white;
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
}

/* GRID */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
padding:15px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
border-radius:18px;
padding:18px;
text-align:center;
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.08);
transition:0.3s;
position:relative;
overflow:hidden;
}

.card::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(120deg,transparent,rgba(0,229,255,0.2),transparent);
opacity:0;
transition:0.3s;
}

.card:hover::before{opacity:1;}
.card:hover{
transform:translateY(-6px) scale(1.02);
box-shadow:0 0 25px rgba(0,229,255,0.4);
}

/* TAGS */
.tag{font-size:11px;margin-bottom:6px;letter-spacing:1px;}
.hot{color:#ff4d4d;}
.pop{color:#ffd740;}
.instant{color:#00e5ff;}

/* TEXT */
.name{font-size:15px;margin:8px 0;opacity:0.9;}
.price{font-size:20px;margin:10px 0;color:#00ffcc;font-weight:bold;}

/* BUTTONS */
.btn{
width:100%;
padding:12px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
margin-top:6px;
transition:0.3s;
}

.wa{
background:linear-gradient(90deg,#00c853,#00e676);
color:black;
}
.wa:hover{transform:scale(1.05);}

.ig{
background:linear-gradient(90deg,#833ab4,#fd1d1d,#fcb045);
color:white;
}
.ig:hover{transform:scale(1.05);}

/* FOOTER */
footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:0.6;
}
</style>
</head>

<body>

<header>⚡ Eclipse Store KE</header>

<div class="filters">
<select id="category">
<option value="All">All Categories</option>
<option value="Gaming">Gaming</option>
<option value="Streaming">Streaming</option>
<option value="Shopping">Shopping</option>
</select>

<select id="region">
<option value="All">All Regions</option>
<option value="USA">USA</option>
<option value="UK">UK</option>
<option value="EU">EU</option>
<option value="UAE">UAE</option>
<option value="GLOBAL">Global</option>
</select>
</div>

<div id="products" class="products"></div>

<footer>© Eclipse Store KE • Instant Delivery</footer>

<script>
const whatsappNumber="254791994148";
const igLink="https://instagram.com/eclipse.store.ke";

const products=[

// 🎮 PLAYSTATION (ALL REGIONS)
{name:"PSN $5",price:"KSh 799",cat:"Gaming",region:"USA",tag:"instant"},
{name:"PSN $10",price:"KSh 1599",cat:"Gaming",region:"USA",tag:"pop"},
{name:"PSN $25",price:"KSh 3999",cat:"Gaming",region:"USA",tag:"hot"},
{name:"PSN $50",price:"KSh 7999",cat:"Gaming",region:"USA",tag:""},
{name:"PSN £10",price:"KSh 1899",cat:"Gaming",region:"UK",tag:""},
{name:"PSN £20",price:"KSh 3599",cat:"Gaming",region:"UK",tag:"pop"},
{name:"PSN €10",price:"KSh 1999",cat:"Gaming",region:"EU",tag:""},
{name:"PSN AED 50",price:"KSh 2100",cat:"Gaming",region:"UAE",tag:""},

// 🎮 XBOX / STEAM
{name:"Xbox $10",price:"KSh 1500",cat:"Gaming",region:"USA",tag:""},
{name:"Xbox $50",price:"KSh 7500",cat:"Gaming",region:"USA",tag:""},
{name:"Steam $10",price:"KSh 1500",cat:"Gaming",region:"GLOBAL",tag:""},
{name:"Steam $20",price:"KSh 3000",cat:"Gaming",region:"GLOBAL",tag:"pop"},

// 🎬 STREAMING
{name:"Netflix",price:"KSh 1200",cat:"Streaming",region:"GLOBAL",tag:"pop"},
{name:"Spotify",price:"KSh 900",cat:"Streaming",region:"GLOBAL",tag:""},
{name:"Disney+",price:"KSh 1300",cat:"Streaming",region:"GLOBAL",tag:""},

// 🛒 SHOPPING
{name:"Amazon $10",price:"KSh 1500",cat:"Shopping",region:"USA",tag:""},
{name:"Amazon $25",price:"KSh 3600",cat:"Shopping",region:"USA",tag:""},
{name:"Apple $10",price:"KSh 1500",cat:"Shopping",region:"USA",tag:""},
{name:"Google Play $10",price:"KSh 1500",cat:"Shopping",region:"GLOBAL",tag:""}

];

function renderProducts(){
const container=document.getElementById("products");
container.innerHTML="";

const cat=document.getElementById("category").value;
const region=document.getElementById("region").value;

products.forEach(p=>{
if((cat==="All"||p.cat===cat)&&(region==="All"||p.region===region)){

let tagClass=p.tag;
let tagText=p.tag.toUpperCase();

container.innerHTML+=`
<div class="card">
<div class="tag ${tagClass}">${tagText}</div>
<div class="name">${p.name}</div>
<div class="price">${p.price}</div>

<button class="btn wa" onclick="buy('${p.name}','${p.price}')">
Buy via WhatsApp
</button>

<button class="btn ig" onclick="openIG()">
View Instagram
</button>
</div>
`;
}
});
}

function buy(name,price){
const msg=`Hello, I want to buy ${name} for ${price}`;
window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`);
}

function openIG(){
window.open(igLink);
}

document.getElementById("category").onchange=renderProducts;
document.getElementById("region").onchange=renderProducts;

renderProducts();
</script>

</body>
</html>
