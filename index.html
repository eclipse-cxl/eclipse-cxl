<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Shop</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  padding:10px;
  text-align:center;
  background:#111;
  z-index:10;
}

/* TOGGLE */
.toggle{
  position:fixed;
  top:50px;
  width:100%;
  text-align:center;
  z-index:10;
}

.toggle button{
  margin:5px;
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
}

/* GRID VIEW */
#grid{
  margin-top:100px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#111;
  padding:15px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,255,150,0.2);
}

.price{
  color:#00ff99;
  font-size:18px;
  margin:5px 0;
}

.tag{
  color:gold;
  font-size:12px;
}

/* TIKTOK VIEW */
#feed{
  display:none;
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.slide{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  scroll-snap-align:start;
}

/* BUTTONS */
.btns{
  display:flex;
  gap:5px;
  margin-top:10px;
}

button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.wa{background:#25D366;color:white;}
.ig{background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);color:white;}

/* ADMIN */
#adminPanel{
  position:fixed;
  top:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  z-index:20;
  padding:20px;
}

input{
  width:100%;
  margin:5px 0;
  padding:10px;
}
</style>
</head>

<body>

<header>
⚡ Eclipse Shop
<button onclick="openAdmin()" style="opacity:0.3;">⚙️</button>
</header>

<div class="toggle">
<button onclick="showGrid()">🛒 Shop</button>
<button onclick="showFeed()">🎬 TikTok Mode</button>
</div>

<div id="grid"></div>
<div id="feed"></div>

<!-- ADMIN -->
<div id="adminPanel">
<h2>Admin Panel</h2>
<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price">
<input id="region" placeholder="Region">
<input id="tag" placeholder="Tag (BEST / HOT)">
<button onclick="addProduct()">Add Product</button>
<button onclick="closeAdmin()">Close</button>
</div>

<script>

let WA="https://wa.me/254791994148";
let IG="https://instagram.com/eclipse.sh0p";

/* PRODUCTS */
let products = JSON.parse(localStorage.getItem("products")) || [

{name:"PSN $10 USA",price:1599,tag:"🔥 BEST"},
{name:"PSN $20 USA",price:2999},
{name:"PSN $50 USA",price:6999,tag:"💰 VALUE"},
{name:"PSN $100 USA",price:13499},

{name:"PSN £10 UK",price:1999},
{name:"PSN £25 UK",price:4699,tag:"🔥 HOT"},
{name:"PSN £50 UK",price:8999},

{name:"PSN R200 SA",price:1999},
{name:"PSN R500 SA",price:4799},

{name:"Amazon $10",price:1599},
{name:"Amazon $25",price:3999,tag:"🔥 BEST"},
{name:"Amazon $50",price:7299},

{name:"Fortnite 1000 V-Bucks",price:1499},
{name:"Fortnite 2800 V-Bucks",price:3999,tag:"🔥 HOT"},
{name:"Fortnite 5000 V-Bucks",price:6999},

{name:"Roblox 400 Robux",price:899},
{name:"Roblox 800 Robux",price:1499,tag:"🔥 BEST"},
{name:"Roblox 1700 Robux",price:2799},

{name:"Steam $10",price:1599},
{name:"Steam $50",price:6999},

{name:"iTunes $10",price:1599},
{name:"iTunes $50",price:7299},

{name:"Spotify 1 Month",price:499},
{name:"Spotify 3 Months",price:1299},

{name:"Netflix 1 Month",price:799}

];

/* RENDER */
function render(){

let grid=document.getElementById("grid");
let feed=document.getElementById("feed");

grid.innerHTML="";
feed.innerHTML="";

products.forEach(p=>{

grid.innerHTML+=`
<div class="card">
<h3>${p.name}</h3>
${p.tag ? `<div class="tag">${p.tag}</div>` : ""}
<div class="price">KES ${p.price}</div>
<div class="btns">
<button class="wa" onclick="buyWA('${p.name}')">WA</button>
<button class="ig" onclick="buyIG()">IG</button>
</div>
</div>
`;

feed.innerHTML+=`
<div class="slide">
<div class="card">
<h2>${p.name}</h2>
${p.tag ? `<div class="tag">${p.tag}</div>` : ""}
<div class="price">KES ${p.price}</div>
<div class="btns">
<button class="wa" onclick="buyWA('${p.name}')">WhatsApp</button>
<button class="ig" onclick="buyIG()">Instagram</button>
</div>
</div>
</div>
`;

});
}

/* VIEW SWITCH */
function showGrid(){
document.getElementById("grid").style.display="grid";
document.getElementById("feed").style.display="none";
}

function showFeed(){
document.getElementById("grid").style.display="none";
document.getElementById("feed").style.display="block";
}

/* BUY */
function buyWA(name){
window.location.href=WA+"?text=I want "+encodeURIComponent(name);
}

function buyIG(){
window.location.href=IG;
}

/* ADMIN (PASSWORD = 8363) */
function openAdmin(){
let pass=prompt("Enter admin code:");
if(pass && pass.trim()==="8363"){
document.getElementById("adminPanel").style.display="block";
}else{
alert("Wrong code");
}
}

function closeAdmin(){
document.getElementById("adminPanel").style.display="none";
}

function addProduct(){
let name=document.getElementById("name").value;
let price=document.getElementById("price").value;
let tag=document.getElementById("tag").value;

products.push({name,price,tag});
localStorage.setItem("products",JSON.stringify(products));

render();
alert("Added!");
}

render();

</script>

</body>
</html>
