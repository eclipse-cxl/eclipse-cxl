<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Store</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0a0a0a;
  color:white;
}

header {
  text-align:center;
  padding:15px;
  font-size:22px;
  font-weight:bold;
  background:black;
}

.toggle {
  text-align:center;
  margin:10px;
}

button {
  padding:10px;
  margin:5px;
  border:none;
  background:#00ffcc;
  border-radius:6px;
  cursor:pointer;
}

.grid {
  display:grid;
  grid-template-columns: repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card {
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.swipe {
  display:none;
}

.swipe-item {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h2 { margin:10px; color:#00ffcc; }
h3 { margin-left:10px; color:#aaa; }

.admin {
  display:none;
  padding:10px;
}

input {
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<header>ECLIPSE STORE 💎</header>

<div class="toggle">
  <button onclick="showGrid()">Grid</button>
  <button onclick="showSwipe()">Swipe</button>
  <button onclick="openAdmin()">Admin</button>
</div>

<div id="grid" class="grid"></div>
<div id="swipe" class="swipe"></div>

<div id="admin" class="admin">
  <h3>Admin Panel</h3>
  <input id="name" placeholder="Name">
  <input id="price" placeholder="Price">
  <button onclick="addProduct()">Add</button>
</div>

<script>
const password = "8363";

let products = JSON.parse(localStorage.getItem("products")) || [

{

]
},

products:[

]
},
{

products:[

{

]
}
]
},

{

items:[
{

{

items:[
{

]

{

{name:"Amazon $50",price:6999}
]
}

];

function save(){
localStorage.setItem("products",JSON.stringify(products));
}

function render(){
let grid=document.getElementById("grid");
let swipe=document.getElementById("swipe");

grid.innerHTML="";
swipe.innerHTML="";

products.forEach(cat=>{
grid.innerHTML+=`<h2>${cat.category}</h2>`;

cat.items.forEach(region=>{
grid.innerHTML+=`<h3>${region.region}</h3>`;

region.products.forEach(p=>{

grid.innerHTML+=`
<div class="card">
<h4>${p.name}</h4>
<p>KES ${p.price}</p>
<button onclick="buy('${p.name}',${p.price})">Buy</button>
</div>
`;

swipe.innerHTML+=`
<div class="swipe-item">
<h2>${p.name}</h2>
<p>${cat.category} - ${region.region}</p>
<p>KES ${p.price}</p>
<button onclick="buy('${p.name}',${p.price})">Buy Now</button>
</div>
`;

});
});
});
}

function buy(name,price){
let msg=`Hello, I want ${name} for KES ${price}`;
window.open(`https://wa.me/254791994148?text=${encodeURIComponent(msg)}`);
}

function showGrid(){
document.getElementById("grid").style.display="grid";
document.getElementById("swipe").style.display="none";
}

function showSwipe(){
document.getElementById("grid").style.display="none";
document.getElementById("swipe").style.display="block";
}

function openAdmin(){
let pass=prompt("Password?");
if(pass===password){
document.getElementById("admin").style.display="block";
}else{
alert("Wrong password");
}
}

function addProduct(){
let name=document.getElementById("name").value;
let price=document.getElementById("price").value;

products.push({
category:"Custom",
items:[{region:"General",products:[{name:name,price:price}]}]
});

save();
render();
}

render();
showGrid();
</script>

</body>
</html>
