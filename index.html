<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Store KE</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b0b0b;
    color:white;
}

header {
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    background:#111;
}

.search {
    width:90%;
    margin:15px auto;
    padding:14px;
    border-radius:12px;
    border:none;
    background:#1a1a1a;
    color:white;
}

.filters {
    text-align:center;
    margin-bottom:10px;
}

.filters button {
    margin:5px;
    padding:10px 14px;
    border:none;
    border-radius:20px;
    background:#222;
    color:white;
    cursor:pointer;
}

.products {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:15px;
    padding:15px;
}

.card {
    background:#141414;
    padding:15px;
    border-radius:15px;
    text-align:center;
    transition:0.2s;
}

.card:hover {
    transform:scale(1.05);
}

.price {
    font-size:18px;
    margin:8px 0;
}

.tag {
    font-size:12px;
    margin-bottom:6px;
    color:#00e5ff;
}

button {
    margin-top:6px;
    padding:10px;
    width:100%;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

.wa { background:#00c853; }
.ig { background:#E1306C; }

</style>
</head>

<body>

<header>ECLIPSE STORE KE</header>

<input id="search" class="search" placeholder="Search cards..." onkeyup="renderProducts()">

<div class="filters">
<button onclick="setFilter('all')">All</button>
<button onclick="setFilter('psn')">PSN</button>
<button onclick="setFilter('xbox')">Xbox</button>
<button onclick="setFilter('steam')">Steam</button>
<button onclick="setFilter('itunes')">iTunes</button>
<button onclick="setFilter('google')">Google Play</button>
<button onclick="setFilter('amazon')">Amazon</button>
</div>

<div id="products" class="products"></div>

<script>

// ================= PRODUCT SYSTEM =================
const products = [];

// ===== PSN (YOUR PRICES) =====
[
["PSN $5","kenya",849,""],
["PSN $10","kenya",1599,"⭐ Best Seller"],
["PSN $25","kenya",3999,""],
["PSN $50","kenya",7999,"🔥 Popular"],
["PSN $75","kenya",11999,""],
["PSN $100","kenya",15499,"💎 Value"]
].forEach(p=>{
products.push({name:p[0],price:p[2],category:"psn",region:p[1],tag:p[3]});
});

// ===== XBOX (FULL OPTIONS) =====
[
["Xbox $5","usa",829,""],
["Xbox $10","usa",1549,"⭐ Best Seller"],
["Xbox $15","usa",2299,"🔥 Smart Choice"],
["Xbox $20","usa",3049,""],
["Xbox $25","usa",3899,""],
["Xbox $50","usa",7799,"💎 Popular"],
["Xbox $100","usa",15299,""]
].forEach(p=>{
products.push({name:p[0],price:p[2],category:"xbox",region:p[1],tag:p[3]});
});

// ===== AUTO PRODUCTS =====
function addSeries(name, values, rate, category){
    values.forEach(v=>{
        products.push({
            name:`${name} $${v}`,
            price:Math.round(v*rate),
            category:category,
            region:"usa",
            tag:""
        });
    });
}

// OTHER CARDS
addSeries("Steam",[5,10,20,50],155,"steam");
addSeries("iTunes",[10,25,50],155,"itunes");
addSeries("Google Play",[10,25,50],150,"google");
addSeries("Amazon",[10,25,50],160,"amazon");

// ================= FILTER =================
let activeFilter = "all";

function setFilter(f){
    activeFilter = f;
    renderProducts();
}

// ================= RENDER =================
function renderProducts(){
    let container = document.getElementById("products");
    let search = document.getElementById("search").value.toLowerCase();

    container.innerHTML = "";

    products.forEach(p=>{
        let text = (p.name + p.category).toLowerCase();

        if((activeFilter==="all" || p.category===activeFilter) && text.includes(search)){

            container.innerHTML += `
            <div class="card">
                <div class="tag">${p.tag}</div>
                <h3>${p.name}</h3>
                <div class="price">KSh ${p.price}</div>

                <button class="wa" onclick="buy('${p.name}')">WhatsApp</button>
                <button class="ig" onclick="instagram('${p.name}')">Instagram</button>
            </div>
            `;
        }
    });
}

// ================= CHECKOUT =================
function buy(product){
    window.open(`https://wa.me/254791994148?text=${encodeURIComponent("Hi, I want "+product)}`);
}

function instagram(product){
    window.open(`https://instagram.com/eclipse.store.ke`);
}

// INIT
renderProducts();

</script>

</body>
</html>
