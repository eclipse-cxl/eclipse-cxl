<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Shop</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#000;
  color:white;
  overflow:hidden;
}

/* TOP BAR */
header{
  position:fixed;
  top:0;
  width:100%;
  padding:15px;
  text-align:center;
  background:#111;
  z-index:10;
}

/* SCROLL CONTAINER */
#feed{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

/* PRODUCT SLIDES */
.slide{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  scroll-snap-align:start;
  padding:20px;
  box-sizing:border-box;
}

.card{
  background:linear-gradient(145deg,#111,#1a1a1a);
  padding:25px;
  border-radius:20px;
  width:85%;
  max-width:350px;
  box-shadow:0 0 20px rgba(0,255,150,0.2);
}

.price{
  color:#00ff99;
  font-size:22px;
  margin:10px 0;
}

/* TAGS */
.tag{
  color:gold;
  font-size:12px;
  margin-bottom:10px;
}

/* BUTTONS */
.btns{
  display:flex;
  gap:10px;
  margin-top:15px;
}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.ig{
  background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);
  color:white;
}

.wa{
  background:#25D366;
  color:white;
}

/* FILTER BAR */
.filters{
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:10;
}

.filters button{
  padding:8px 10px;
  border-radius:20px;
  border:none;
  background:#222;
  color:white;
  font-size:12px;
}
</style>
</head>

<body>

<header>⚡ Eclipse Shop</header>

<div id="feed"></div>

<!-- FILTERS -->
<div class="filters">
<button onclick="setFilter('ALL')">All</button>
<button onclick="setFilter('USA')">USA</button>
<button onclick="setFilter('UK')">UK</button>
<button onclick="setFilter('SA')">SA</button>
<button onclick="setFilter('UAE')">UAE</button>
</div>

<script>

let IG = "https://instagram.com/eclipse.sh0p";
let WA = "https://wa.me/254791994148";

let filter = "ALL";

let products = [

{name:"PSN $10 USA", price:1599, region:"USA", tag:"🔥 BEST"},
{name:"PSN $50 USA", price:6999, region:"USA", tag:"💰 VALUE"},

{name:"Amazon $25", price:4000, region:"USA"},
{name:"Fortnite 2800 V-Bucks", price:4000, region:"USA", tag:"🔥 HOT"},
{name:"Roblox 800 Robux", price:1500, region:"USA", tag:"🔥 BEST"},

{name:"PSN £25 UK", price:5200, region:"UK"},
{name:"PSN R200 SA", price:2000, region:"SA"},
{name:"PSN AED 50 UAE", price:2300, region:"UAE"}

];

function render(){
  let feed = document.getElementById("feed");
  feed.innerHTML = "";

  products.forEach((p,i)=>{
    if(filter==="ALL" || p.region===filter){

      feed.innerHTML += `
      <div class="slide">

        <div class="card">

          <h2>${p.name}</h2>

          ${p.tag ? `<div class="tag">${p.tag}</div>` : ""}

          <div class="price">KES ${p.price}</div>

          <div class="btns">

            <button class="ig" onclick="buyIG('${p.name}')">Instagram</button>

            <button class="wa" onclick="buyWA('${p.name}')">WhatsApp</button>

          </div>

        </div>

      </div>
      `;
    }
  });
}

function setFilter(f){
  filter = f;
  render();
}

function buyIG(name){
  window.location.href = IG + "?text=I want " + encodeURIComponent(name);
}

function buyWA(name){
  window.location.href = WA + "?text=I want " + encodeURIComponent(name);
}

render();

</script>

</body>
</html>
