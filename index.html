<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Store</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  text-align: center;
}

header {
  background: black;
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: #1a1a1a;
  padding: 20px;
  border-radius: 10px;
}

button {
  padding: 10px;
  margin-top: 10px;
  border: none;
  background: #00ff99;
  cursor: pointer;
  border-radius: 5px;
}

#checkout {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
}

.checkout-box {
  background:#1a1a1a;
  padding:20px;
  border-radius:10px;
}

input {
  width:90%;
  padding:10px;
  margin:10px;
}
</style>
</head>

<body>

<header>⚡ Eclipse Store</header>

<h3>🔥 Instant Delivery Codes</h3>

<div class="products">

<div class="card">
<h4>$10 Roblox</h4>
<p>KES 1599</p>
<button onclick="openCheckout('Roblox $10',1599)">Buy</button>
</div>

<div class="card">
<h4>1000 V-Bucks</h4>
<p>KES 1050</p>
<button onclick="openCheckout('V-Bucks 1000',1050)">Buy</button>
</div>

</div>

<!-- CHECKOUT -->
<div id="checkout">
  <div class="checkout-box">
    <h2 id="itemName"></h2>

    <input id="name" placeholder="Your Name">
    <input id="phone" placeholder="WhatsApp Number">

    <button onclick="payWhatsApp()">📲 WhatsApp</button>
    <button onclick="payInstagram()">📸 Instagram</button>
    <button onclick="closeCheckout()">❌ Cancel</button>
  </div>
</div>

<script>

let product = "";
let price = "";

function openCheckout(p, pr){
  product = p;
  price = pr;

  document.getElementById("itemName").innerText = p + " - KES " + pr;
  document.getElementById("checkout").style.display = "flex";
}

function closeCheckout(){
  document.getElementById("checkout").style.display = "none";
}

function payWhatsApp(){
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;

  let msg = `Hello, I want to buy:

🛒 ${product}
💰 KES ${price}
👤 ${name}
📞 ${phone}

I will pay via M-Pesa now.`;

  window.location.href =
  "https://wa.me/254791994148?text=" + encodeURIComponent(msg);
}

function payInstagram(){
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;

  let msg = `I want ${product} (KES ${price}) Name:${name} Phone:${phone}`;

  navigator.clipboard.writeText(msg);

  alert("Message copied! Paste in Instagram DM.");

  window.location.href = "https://instagram.com/_.bradle.y";
}

// 🔥 FAKE SALES POPUP
setInterval(()=>{
  let names = ["Brian","Kevin","Alex","John"];
  let items = ["Roblox $10","V-Bucks 1000"];

  alert(names[Math.floor(Math.random()*4)] +
  " just bought " +
  items[Math.floor(Math.random()*2)] + " 🔥");
},20000);

</script>

</body>
</html>
