<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Store KE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
background:linear-gradient(180deg,#020202,#050505);
color:white;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:100;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
background:linear-gradient(270deg,#00e5ff,#00ffcc,#00e5ff);
background-size:400% 400%;
animation:glow 6s ease infinite;
color:black;
}

@keyframes glow{
0%{background-position:0%}
50%{background-position:100%}
100%{background-position:0%}
}

/* INSTAGRAM */
.ig-top{
text-align:center;
padding:10px;
}

/* PREMIUM FILTERS */
.filters{
display:flex;
gap:10px;
padding:12px;
position:sticky;
top:70px;
z-index:99;
background:rgba(5,5,5,0.9);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.05);
}

.filter-box{
flex:1;
position:relative;
}

.filter-box select{
width:100%;
padding:14px;
border-radius:14px;
background:rgba(255,255,255,0.05);
color:white;
border:1px solid rgba(255,255,255,0.1);
appearance:none;
font-weight:600;
}

.filter-box::after{
content:"▼";
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
font-size:10px;
opacity:0.6;
}

/* GRID */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
padding:15px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
border-radius:18px;
padding:18px;
text-align:center;
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.08);
transition:0.3s;
position:relative;
overflow:hidden;
}

.card:hover{
transform:translateY(-6px) scale(1.02);
box-shadow:0 0 25px rgba(0,229,255,0.4);
}

/* BADGE */
.badge{
position:absolute;
top:10px;
left:10px;
background:#ffd700;
color:black;
font-size:10px;
padding:4px 8px;
border-radius:8px;
font-weight:bold;
}

/* TEXT */
.name{font-size:15px;margin:8px 0;}
.price{font-size:20px;color:#00ffcc;font-weight:bold;}

/* BUTTON */
.btn{
width:100%;
padding:12px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
background:linear-gradient(90deg,#00c853,#00e676);
color:black;
transition:0.2s;
}
.btn:hover{transform:scale(1.05);}

/* FOOTER */
footer{
text-align:center;
padding:20px;
font-size:12px;
opacity:0.6;
}
</style>
</head>

<body>

<header>⚡ Eclipse Store KE</header>

<div class="ig-top">
<a href="https://instagram.com/eclipse.store.ke" target="_blank">
<button class="btn">Follow us on Instagram</button>
</a>
</div>

<!-- PREMIUM FILTERS -->
<div class="filters">

<div class="filter-box">
<select id="categoryFilter">
<option value="All">🎮 All Categories</option>
<option value="Gaming">🎮 Gaming</option>
<option value="Streaming">🎬 Streaming</option>
<option value="Shopping">🛒 Shopping</option>
</select>
</div>

<div class="filter-box">
<select id="regionFilter">
<option value="All">🌍 All Regions</option>
<option value="USA">🇺🇸 USA</option>
<option value="UK">🇬🇧 UK</option>
<option value="Global">🌐 Global</option>
</select>
</div>

</div>

<div class="products"></div>

<footer>© 2026 Eclipse Store KE</footer>

<script>
const whatsappNumber = "254791994148";

/* PRODUCTS */
const products = [

/* PSN USA */
{name:"PSN $10",price:"KSh 1,599",category:"Gaming",region:"USA"},
{name:"PSN $25",price:"KSh 3,799",category:"Gaming",region:"USA",badge:"BEST SELLER"},
{name:"PSN $50",price:"KSh 7,299",category:"Gaming",region:"USA",badge:"BEST SELLER"},
{name:"PSN $75",price:"KSh 10,799",category:"Gaming",region:"USA"},
{name:"PSN $100",price:"KSh 14,499",category:"Gaming",region:"USA"},

/* PSN UK */
{name:"PSN £10",price:"KSh 1,899",category:"Gaming",region:"UK"},
{name:"PSN £20",price:"KSh 3,699",category:"Gaming",region:"UK"},
{name:"PSN £50",price:"KSh 8,999",category:"Gaming",region:"UK"}

];

/* RENDER */
const container = document.querySelector(".products");

function renderProducts(list){
container.innerHTML = "";

list.forEach(p=>{
container.innerHTML += `
<div class="card">

${p.badge ? `<div class="badge">${p.badge}</div>` : ""}

<div class="name">${p.name}</div>
<div class="price">${p.price}</div>

<button class="btn" onclick="buyNow('${p.name}','${p.price}')">
Buy via WhatsApp
</button>

</div>
`;
});
}

renderProducts(products);

/* FILTER */
const categoryFilter = document.getElementById("categoryFilter");
const regionFilter = document.getElementById("regionFilter");

function filterProducts(){
let category = categoryFilter.value;
let region = regionFilter.value;

let filtered = products.filter(p=>{
return (category === "All" || p.category === category) &&
       (region === "All" || p.region === region);
});

renderProducts(filtered);
}

categoryFilter.addEventListener("change", filterProducts);
regionFilter.addEventListener("change", filterProducts);

/* WHATSAPP */
function buyNow(name, price){

let message =
`🔥 *ECLIPSE STORE KE ORDER* 🔥%0A%0A` +
`🎮 Product: ${name}%0A` +
`💰 Price: ${price}%0A%0A` +
`⚡ Instant delivery%0A` +
`💳 Pay via M-Pesa%0A%0A` +
`Thank you 🙌`;

window.open(`https://wa.me/${whatsappNumber}?text=${message}`);
}
</script>

</body>
</html>
