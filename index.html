<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Shop</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#f5f5f5;
}
header{
    background:#000;
    color:#fff;
    padding:15px;
    text-align:center;
}
.container{
    padding:15px;
}
.filters{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}
.filters button{
    padding:8px 12px;
    border:none;
    background:#ddd;
    cursor:pointer;
}
.product{
    background:#fff;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
}
.price{
    font-weight:bold;
}
.tag{
    color:red;
    font-size:12px;
}
button.buy{
    margin-top:10px;
    padding:8px;
    background:black;
    color:white;
    border:none;
    width:100%;
}
.admin{
    position:fixed;
    top:10px;
    right:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h2>⚡ Eclipse Shop</h2>
</header>

<div class="container">

<div class="filters">
<button onclick="filterRegion('ALL')">All</button>
<button onclick="filterRegion('USA')">USA</button>
<button onclick="filterRegion('UK')">UK</button>
<button onclick="filterRegion('SA')">SA</button>
<button onclick="filterRegion('UAE')">UAE</button>
</div>

<div id="products"></div>

</div>

<div class="admin" onclick="openAdmin()">⚙️</div>

<script>

let IG_LINK = "https://instagram.com/_.bradle.y";

// SMART PRICING SYSTEM
function priceKES(usd){
    return Math.round(usd * 160 + 200); // markup profit
}

// PRODUCTS
let products = [

{ name:"PSN $10 USA", price:priceKES(10), region:"USA", best:true },
{ name:"PSN $20 USA", price:priceKES(20), region:"USA" },
{ name:"PSN $50 USA", price:priceKES(50), region:"USA", best:true },

{ name:"PSN £10 UK", price:priceKES(13), region:"UK" },
{ name:"PSN £25 UK", price:priceKES(30), region:"UK", best:true },

{ name:"PSN R200 SA", price:priceKES(12), region:"SA" },

{ name:"PSN 50 AED UAE", price:priceKES(14), region:"UAE" },

{ name:"Amazon $10", price:priceKES(10), region:"USA", best:true },
{ name:"Amazon $25", price:priceKES(25), region:"USA" },

{ name:"Fortnite 1000 V-Bucks", price:1800, region:"USA", best:true },
{ name:"Fortnite 2800 V-Bucks", price:4000, region:"USA" },

{ name:"Roblox 800 Robux", price:1500, region:"USA", best:true }

];

let currentFilter = "ALL";

function displayProducts(){
    let container = document.getElementById("products");
    container.innerHTML="";

    products.forEach((p,i)=>{
        if(currentFilter==="ALL" || p.region===currentFilter){

            container.innerHTML += `
            <div class="product">
                <div>${p.name}</div>
                <div class="price">KES ${p.price}</div>
                ${p.best ? '<div class="tag">🔥 BEST SELLER</div>' : ''}
                <button class="buy" onclick="buy(${i})">Buy</button>
            </div>
            `;
        }
    });
}

function filterRegion(r){
    currentFilter = r;
    displayProducts();
}

// AUTO UPSELL
function upsell(index){
    let p = products[index];
    let upsellItem = products.find(x => x.price > p.price && x.region === p.region);
    if(upsellItem){
        alert(`🔥 Upgrade to ${upsellItem.name} for better value!`);
    }
}

// BUY BUTTON → DM
function buy(index){
    upsell(index);
    let product = products[index].name;
    window.location.href = IG_LINK + "?text=I want " + encodeURIComponent(product);
}

// ADMIN PANEL
function openAdmin(){
    let pass = prompt("Enter password");
    if(pass==="mouse@123"){
        let newPrice = prompt("Enter product index + new price (e.g 0,2500)");
        if(newPrice){
            let parts = newPrice.split(",");
            products[parts[0]].price = parts[1];
            displayProducts();
            alert("Updated!");
        }
    }
}

displayProducts();

</script>

</body>
</html>
