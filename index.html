<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Store KE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
background:linear-gradient(180deg,#020202,#050505);
color:white;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:100;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
background:linear-gradient(270deg,#00e5ff,#00ffcc,#00e5ff);
background-size:400% 400%;
animation:glow 6s ease infinite;
color:black;
}

@keyframes glow{
0%{background-position:0%}
50%{background-position:100%}
100%{background-position:0%}
}

/* INSTAGRAM TOP */
.ig-top{
text-align:center;
padding:10px;
}

/* FILTERS */
.filters{
display:flex;
gap:10px;
padding:12px;
position:sticky;
top:70px;
z-index:99;
background:rgba(5,5,5,0.9);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.05);
}

.filter-box{
flex:1;
position:relative;
}

.filter-box select{
width:100%;
padding:14px;
border-radius:14px;
background:rgba(255,255,255,0.05);
color:white;
border:1px solid rgba(255,255,255,0.1);
appearance:none;
font-weight:bold;
}

.filter-box::after{
content:"▼";
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
font-size:10px;
opacity:0.6;
}

/* GRID */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
padding:15px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
border-radius:18px;
padding:18px;
text-align:center;
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.08);
transition:0.3s;
position:relative;
}

.card:hover{
transform:translateY(-6px) scale(1.02);
box-shadow:0 0 25px rgba(0,229,255,0.4);
}

/* BADGE */
.badge{
position:absolute;
top:10px;
left:10px;
background:#ffd700;
color:black;
font-size:10px;
padding:4px 8px;
border-radius:8px;
font-weight:bold;
}

/* BUTTONS */
.btn-group{
display:flex;
gap:8px;
margin-top:10px;
}

.btn{
flex:1;
padding:10px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.wa{
background:#25D366;
color:white;
}

.ig{
background:linear-gradient(45deg,#fd5949,#d6249f,#285AEB);
color:white;
}

/* FOOTER */
footer{
text-align:center;
padding:25px;
font-size:13px;
opacity:0.7;
line-height:1.6;
border-top:1px solid rgba(255,255,255,0.08);
margin-top:20px;
}
</style>
</head>

<body>

<header>ECLIPSE STORE KE</header>

<div class="ig-top">
<a href="https://instagram.com/eclipse.store.ke" target="_blank">Follow us on Instagram</a>
</div>

<div class="filters">
<div class="filter-box">
<select id="categoryFilter">
<option value="All">All Categories</option>
<option value="Gaming">Gaming</option>
</select>
</div>

<div class="filter-box">
<select id="regionFilter">
<option value="All">All Regions</option>
<option value="USA">USA</option>
<option value="UK">UK</option>
<option value="UAE">UAE</option>
<option value="EU">EU</option>
<option value="Canada">Canada</option>
</select>
</div>
</div>

<div class="products"></div>

<footer>
<p>© 2026 Eclipse Store KE</p>
<p>⚡ Instant Delivery | 🔒 Trusted Seller</p>
<p>📲 WhatsApp: 0791 994 148</p>
</footer>

<script>
const products = [

/* USA */
{name:"PSN $10",price:"KSh 1,599",category:"Gaming",region:"USA"},
{name:"PSN $25",price:"KSh 3,799",category:"Gaming",region:"USA",badge:"BEST SELLER"},
{name:"PSN $50",price:"KSh 7,299",category:"Gaming",region:"USA",badge:"BEST SELLER"},
{name:"PSN $75",price:"KSh 10,799",category:"Gaming",region:"USA"},
{name:"PSN $100",price:"KSh 14,499",category:"Gaming",region:"USA"},

/* UK */
{name:"PSN £10",price:"KSh 1,899",category:"Gaming",region:"UK"},
{name:"PSN £20",price:"KSh 3,699",category:"Gaming",region:"UK"},
{name:"PSN £50",price:"KSh 8,999",category:"Gaming",region:"UK"},

/* UAE */
{name:"PSN AED 50",price:"KSh 2,299",category:"Gaming",region:"UAE"},
{name:"PSN AED 100",price:"KSh 4,399",category:"Gaming",region:"UAE"},

/* EU */
{name:"PSN €10",price:"KSh 1,799",category:"Gaming",region:"EU"},
{name:"PSN €25",price:"KSh 3,999",category:"Gaming",region:"EU"},

/* CANADA */
{name:"PSN CAD 10",price:"KSh 1,699",category:"Gaming",region:"Canada"},
{name:"PSN CAD 50",price:"KSh 7,099",category:"Gaming",region:"Canada"}

];

const container = document.querySelector(".products");

function renderProducts(list){
container.innerHTML = "";
list.forEach(p=>{
container.innerHTML += `
<div class="card">
${p.badge ? `<div class="badge">${p.badge}</div>` : ""}
<h3>${p.name}</h3>
<p>${p.price}</p>

<div class="btn-group">
<button onclick="buyNow('${p.name}','${p.price}')" class="btn wa">📲 WhatsApp</button>
<a href="https://instagram.com/eclipse.store.ke" target="_blank">
<button class="btn ig">📸 Instagram</button>
</a>
</div>

</div>
`;
});
}

renderProducts(products);

/* FILTERS */
const categoryFilter = document.getElementById("categoryFilter");
const regionFilter = document.getElementById("regionFilter");

categoryFilter.addEventListener("change", filterProducts);
regionFilter.addEventListener("change", filterProducts);

function filterProducts(){
let category = categoryFilter.value;
let region = regionFilter.value;

let filtered = products.filter(p=>{
return (category==="All"||p.category===category) &&
(region==="All"||p.region===region);
});

renderProducts(filtered);
}

/* WHATSAPP */
function buyNow(name,price){
let message = `🔥 ECLIPSE STORE KE ORDER 🔥%0A%0A🎮 Product: ${name}%0A💰 Price: ${price}%0A%0A⚡ Instant Delivery%0A📲 Pay via M-Pesa`;
window.open(`https://wa.me/254791994148?text=${message}`,"_blank");
}
</script>

</body>
</html>
