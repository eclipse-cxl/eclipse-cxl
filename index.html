<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Store KE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
background:linear-gradient(180deg,#020202,#050505);
color:white;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:100;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
background:linear-gradient(270deg,#00e5ff,#00ffcc,#00e5ff);
background-size:400% 400%;
animation:glow 6s ease infinite;
color:black;
}

@keyframes glow{
0%{background-position:0%}
50%{background-position:100%}
100%{background-position:0%}
}

/* FILTERS */
.filters{
display:flex;
gap:10px;
padding:12px;
position:sticky;
top:70px;
z-index:99;
background:rgba(5,5,5,0.9);
backdrop-filter:blur(12px);
}

.filter-box{flex:1;}

.filter-box select{
width:100%;
padding:14px;
border-radius:14px;
background:rgba(255,255,255,0.05);
color:white;
border:1px solid rgba(255,255,255,0.1);
}

/* GRID */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
padding:15px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
border-radius:18px;
padding:18px;
text-align:center;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.05);
position:relative;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px) scale(1.02);
}

/* BADGE */
.badge{
position:absolute;
top:10px;
left:10px;
background:#00ffcc;
color:black;
font-size:10px;
padding:5px 8px;
border-radius:8px;
font-weight:bold;
}

/* TEXT */
.name{font-size:15px;margin:8px 0;}
.price{font-size:20px;color:#00ffcc;font-weight:bold;}

/* BUTTONS */
.btn-group{
display:flex;
gap:10px;
margin-top:12px;
}

.btn{
flex:1;
padding:10px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.wa{background:#25D366;color:white;}
.ig{background:linear-gradient(45deg,#fd5949,#d6249f,#285AEB);color:white;}

footer{
text-align:center;
padding:20px;
opacity:0.6;
}
</style>
</head>

<body>

<header>ECLIPSE STORE KE</header>

<!-- FILTERS -->
<div class="filters">
<div class="filter-box">
<select id="categoryFilter" onchange="filterProducts()">
<option value="all">All Categories</option>
<option value="PSN">PSN</option>
<option value="Xbox">Xbox</option>
<option value="Roblox">Roblox</option>
<option value="Amazon">Amazon</option>
<option value="Steam">Steam</option>
<option value="Apple">Apple</option>
<option value="Google">Google Play</option>
</select>
</div>

<div class="filter-box">
<select id="regionFilter" onchange="filterProducts()">
<option value="all">All Regions</option>
<option value="USA">USA</option>
<option value="UK">UK</option>
<option value="UAE">UAE</option>
<option value="EU">EU</option>
<option value="Canada">Canada</option>
<option value="South Africa">South Africa</option>
<option value="Global">Global</option>
</select>
</div>
</div>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<footer>© 2026 Eclipse Store KE</footer>

<script>
const phone = "254791994148";

const products = [

/* 🎮 PSN ALL REGIONS */
{name:"PSN $5",price:"KSh 800",category:"PSN",region:"USA"},
{name:"PSN $10",price:"KSh 1,599",category:"PSN",region:"USA"},
{name:"PSN $25",price:"KSh 3,799",category:"PSN",region:"USA",badge:true},
{name:"PSN $50",price:"KSh 7,399",category:"PSN",region:"USA",badge:true},
{name:"PSN $100",price:"KSh 14,500",category:"PSN",region:"USA"},

{name:"PSN £10",price:"KSh 1,700",category:"PSN",region:"UK"},
{name:"PSN £25",price:"KSh 4,200",category:"PSN",region:"UK"},

{name:"PSN AED 50",price:"KSh 1,800",category:"PSN",region:"UAE"},

{name:"PSN €20",price:"KSh 3,200",category:"PSN",region:"EU"},

{name:"PSN CAD 20",price:"KSh 2,900",category:"PSN",region:"Canada"},

{name:"PSN R100",price:"KSh 800",category:"PSN",region:"South Africa"},
{name:"PSN R200",price:"KSh 1,500",category:"PSN",region:"South Africa"},

/* 🎮 XBOX */
{name:"Xbox $10",price:"KSh 1,600",category:"Xbox",region:"USA"},
{name:"Xbox $25",price:"KSh 3,900",category:"Xbox",region:"USA",badge:true},
{name:"Xbox R200",price:"KSh 1,500",category:"Xbox",region:"South Africa"},

/* 🟢 ROBLOX */
{name:"Roblox $10",price:"KSh 1,500",category:"Roblox",region:"Global"},
{name:"Roblox $25",price:"KSh 3,800",category:"Roblox",region:"Global"},

/* 🛒 AMAZON */
{name:"Amazon $10",price:"KSh 1,600",category:"Amazon",region:"USA"},
{name:"Amazon $25",price:"KSh 3,900",category:"Amazon",region:"USA"},

/* 🎮 STEAM */
{name:"Steam $10",price:"KSh 1,500",category:"Steam",region:"Global"},
{name:"Steam R200",price:"KSh 1,500",category:"Steam",region:"South Africa"},

/* 🍏 APPLE */
{name:"Apple $10",price:"KSh 1,600",category:"Apple",region:"USA"},

/* ▶ GOOGLE PLAY */
{name:"Google Play $10",price:"KSh 1,500",category:"Google",region:"USA"},
{name:"Google Play R100",price:"KSh 800",category:"Google",region:"South Africa"}

];

function renderProducts(list){
const container = document.getElementById("products");
container.innerHTML="";

list.forEach(p=>{
container.innerHTML += `
<div class="card">
${p.badge ? '<div class="badge">BEST SELLER</div>' : ''}
<h3>${p.name}</h3>
<p class="price">${p.price}</p>

<div class="btn-group">
<button onclick="buyNow('${p.name}','${p.price}')" class="btn wa">WhatsApp</button>
<a href="https://ig.me/m/eclipse.store.ke" target="_blank" onclick="igCheckout('${p.name}','${p.price}')" class="btn ig">Instagram</a>
</div>

</div>
`;
});
}

function filterProducts(){
const cat = document.getElementById("categoryFilter").value;
const reg = document.getElementById("regionFilter").value;

const filtered = products.filter(p=>{
return (cat==="all"||p.category===cat) &&
       (reg==="all"||p.region===reg);
});

renderProducts(filtered);
}

function buyNow(name, price){
const msg = `ECLIPSE STORE KE ORDER\n\nProduct: ${name}\nPrice: ${price}`;
window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
}

function igCheckout(name, price){
const msg = `ECLIPSE STORE KE ORDER\nProduct: ${name}\nPrice: ${price}`;
navigator.clipboard.writeText(msg);
alert("Message copied! Instagram DM opened. Paste and send.");
}

renderProducts(products);
</script>

</body>
</html>
